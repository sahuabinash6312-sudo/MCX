<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCA + GST Lead CRM</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--sidebar:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:226px;background:var(--sidebar);color:#fff;padding:14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin-bottom:16px}.brand small{display:block;color:#9ca3af;font-size:11px;font-weight:500;margin-top:4px}
nav button{width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:9px 10px;border-radius:8px;margin:1px 0;cursor:pointer;font-size:13px}nav button.active,nav button:hover{background:#1f2937;color:#fff}
.main{flex:1;min-width:0}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:3}.top h1{font-size:18px;margin:0}.content{padding:16px;max-width:1600px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px}.card.clickable{cursor:pointer;transition:.15s}.card.clickable:hover{transform:translateY(-1px);border-color:#93c5fd}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}.card .n{font-size:22px;font-weight:800}.card .l{color:var(--muted);font-size:12px;margin-top:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:12px}.panel h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:9px}.pin-grid{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:7px}.pin-grid .pin-card{padding:10px 8px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.pin-grid .pin-card .kpi{font-size:11px}.pin-grid .pin-card .pin-count{font-size:18px;line-height:1.15;font-weight:800;margin:2px 0}.pin-grid .pin-card .open-label{font-size:10px;color:var(--muted)}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:8px 9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.field textarea{min-height:80px}
.btn{border:1px solid #d0d5dd;background:#fff;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.good{background:#ecfdf3;border-color:#bbf7d0;color:var(--good)}.btn.danger{background:#fef2f2;border-color:#fecaca;color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:7px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:1050px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#475467;position:sticky;top:0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}.badge.good{background:#ecfdf3;color:#166534}.badge.warn{background:#fffbeb;color:#92400e}.badge.bad{background:#fef2f2;color:#991b1b}
.muted{color:var(--muted)}.hidden{display:none!important}.drop{border:2px dashed #cbd5e1;border-radius:10px;padding:20px;text-align:center;background:#f8fafc}.drop input{margin-top:10px}
.pinbox{display:flex;gap:6px;flex-wrap:wrap}.pin{padding:6px 8px;border:1px solid #d0d5dd;border-radius:999px;cursor:pointer;font-size:12px;background:#fff}.pin.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,100%);background:#fff;box-shadow:-10px 0 30px #0002;z-index:10;overflow:auto;padding:16px}.overlay{position:fixed;inset:0;background:#0005;z-index:9}
.kpi{font-size:12px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}

/* Responsive/mobile navigation */
.mobile-menu-btn{display:none;border:1px solid #d0d5dd;background:#fff;color:var(--text);width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:22px;line-height:1;align-items:center;justify-content:center;flex:0 0 auto}
.mobile-menu-btn:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.mobile-menu-backdrop{display:none;position:fixed;inset:0;background:#0007;z-index:19}
.mobile-menu-backdrop.show{display:block}
.side.mobile-open{display:block!important;position:fixed;left:0;top:0;bottom:0;height:100vh;width:min(310px,86vw);z-index:20;overflow-y:auto;box-shadow:12px 0 30px #0004}
.mobile-side-close{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side{width:214px}.content{padding:14px}.top{padding:0 14px}.pin-grid{grid-template-columns:repeat(4,minmax(105px,1fr))}}
@media(max-width:700px){
 .mobile-menu-btn{display:inline-flex}
 .mobile-side-close{display:inline-flex;position:absolute;right:12px;top:12px;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid #374151;background:#1f2937;color:#fff;border-radius:9px;cursor:pointer;font-size:20px}
 .side{display:none}
 .main{width:100%;min-width:0}
 .top{min-height:58px;height:auto;padding:7px 10px;gap:8px;align-items:center}
 .top h1{font-size:16px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .top .actions{gap:6px;flex:0 0 auto}
 .top .actions .btn{padding:9px 10px;font-size:12px}
 .top .actions .btn:first-child{display:none}
 .content{padding:10px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .grid{grid-template-columns:1fr}
 .pin-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .pin-grid .pin-card{padding:6px 4px;min-height:58px;border-radius:9px}
 .pin-grid .pin-card .pin-count{font-size:17px}
 .pin-grid .pin-card .open-label{font-size:9px}
 .card{padding:10px}
 .panel{padding:10px;margin-top:9px}
 .toolbar{align-items:stretch}
 .toolbar>*,.toolbar .actions{width:100%}
 .toolbar .actions .btn{flex:1}
 .actions .btn{min-height:40px}
 .field input,.field select,.field textarea{font-size:16px;min-height:42px}
 .drop{padding:16px 12px}
 .table-wrap{-webkit-overflow-scrolling:touch}
 .table{min-width:980px}
 .drawer{width:100%;max-width:100%;padding:14px}
 .drawer .toolbar{position:sticky;top:0;background:#fff;z-index:2;padding-bottom:8px}
 nav button{padding:13px 14px;font-size:15px}
}
@media(min-width:701px){.mobile-menu-backdrop{display:none!important}.mobile-menu-btn{display:none!important}}

 .card .muted{margin-top:4px;font-size:11px} .empty{padding:20px;text-align:center;color:var(--muted)}

/* UX density pass: compact defaults without sacrificing touch targets */
.section-lead{margin:0 0 8px!important}
.panel>p{margin:6px 0 0}
.panel>.toolbar h2{margin-bottom:0}
.panel .table-wrap{margin-top:4px}
.pin-grid .card{box-shadow:none}
@media(max-width:700px){
  .top .actions .btn{min-height:38px;padding:7px 9px}
  .panel p{line-height:1.35}
  .table th,.table td{padding:7px}
}

.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#f8fafc;font-size:11px;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}
.sync-dot.on{background:#16a34a}.sync-dot.off{background:#b91c1c}
.auth-shell{min-height:60vh;display:grid;place-items:center}.auth-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 30px #0000000d}
.auth-card h2{margin:0 0 6px}.auth-card .muted{margin-bottom:14px}.auth-error{margin-top:10px;padding:9px;border-radius:8px;background:#fef2f2;color:#991b1b;font-size:12px}
@media(max-width:700px){.sync-pill{font-size:10px}.auth-card{padding:14px}}
</style>

<body>
<div class="app">
<div id="mobileBackdrop" class="mobile-menu-backdrop" onclick="closeMobileMenu()"></div>
<aside class="side" id="sidebar">
<button class="mobile-side-close" aria-label="Close menu" onclick="closeMobileMenu()">×</button>
<div class="brand">MCA + GST CRM<small>Target → Call → Lead → Follow-up</small></div>
<nav id="nav">
<button data-page="dashboard" class="active">Dashboard</button>
<button data-page="targets">My Target Customers</button>
<button data-page="companies">All Companies</button>
<button data-page="interested">Interested Leads</button>
<button data-page="potential">Potential Leads</button>
<button data-page="followups">Follow-ups</button>
<button data-page="calls">Call History</button>
<button data-page="upload">Data Upload</button>
<button data-page="exports">Exports</button>
<button data-page="settings">Settings</button>
</nav>
</aside>
<main class="main">
<header class="top"><button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" onclick="toggleMobileMenu()">☰</button><h1 id="title">Dashboard</h1><div class="actions"><button class="btn" onclick="backup()">Backup CRM</button><button class="btn primary" onclick="document.querySelector('#fileInput').click()">Upload Data</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.xlsb,.ods,.csv" multiple class="hidden">

<div id="overlay" class="overlay hidden" onclick="closeDrawer()"></div><aside id="drawer" class="drawer hidden"></aside>

<script>
const DB_NAME="mca_gst_crm_super_v5"; const DB_STORE="app"; const DB_KEY="state";
const SUPABASE_URL="https://pwtiredgrvyboxywvcxo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_L3uw5q_bFtj3PAeltLbj4g_y5OEWS8N";
const SHARED_MODE=SUPABASE_URL.startsWith("https://") && !SUPABASE_ANON_KEY.startsWith("PASTE_") && !!window.supabase;
const sb=SHARED_MODE?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let state=null, sample=null, currentUser=null, syncBusy=false, authReady=false;
const pages={dashboard:"Dashboard",targets:"My Target Customers",companies:"All Companies",interested:"Interested Leads",potential:"Potential Leads",followups:"Follow-ups",calls:"Call History",upload:"Data Upload",exports:"Exports",settings:"Settings"};
const defaultPins=["110061","110030","110038","110097","122012","122013","122018","122101","122102","122098","122001","122002","122017","122015","122016","122009","122003"];
const REQUIRED_FIELDS=["Company Name","and at least one identifier/contact (GSTIN, PAN, CIN, mobile or email)"];

function idbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbGet(){return idbOpen().then(db=>new Promise((resolve,reject)=>{const r=db.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(DB_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)}))}
function idbPut(v){return idbOpen().then(db=>new Promise((resolve,reject)=>{const r=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).put(v,DB_KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)}))}
function sharedConfigured(){return SHARED_MODE && sb}
function syncLabel(){
 const el=document.getElementById("syncStatus"); if(!el)return;
 if(sharedConfigured()&&currentUser) el.innerHTML=`<span class="sync-dot on"></span>Shared sync`;
 else if(sharedConfigured()) el.innerHTML=`<span class="sync-dot"></span>Sign in to sync`;
 else el.innerHTML=`<span class="sync-dot off"></span>Local only`;
}
function showAuth(){
 const c=document.getElementById("content");
 document.getElementById("title").textContent="Sign in";
 c.innerHTML=`<div class="auth-shell"><div class="auth-card">
 <h2>CRM Sign in</h2><div class="muted">${sharedConfigured()?"Sign in to load the same CRM data on every device.":"Shared sync is not configured yet. Add your Supabase URL and anon key in this file first."}</div>
 ${sharedConfigured()?`<div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
 <div class="field" style="margin-top:8px"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
 <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="signIn()">Sign In</button><button class="btn" onclick="signUp()">Create Account</button></div><div id="authMsg"></div>`:
 `<div class="panel" style="margin-top:14px"><b>Setup required</b><p class="muted">Create the Supabase table using the SQL in README.md, then paste the project URL and anon key into <code>index.html</code>.</p></div>`}
 </div></div>`;
}
async function signIn(){
 const email=clean(document.getElementById("authEmail")?.value), password=document.getElementById("authPassword")?.value||"", msg=document.getElementById("authMsg");
 if(!email||!password){if(msg)msg.innerHTML='<div class="auth-error">Enter email and password.</div>';return}
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){if(msg)msg.innerHTML=`<div class="auth-error">${esc(error.message)}</div>`}
}
async function signUp(){
 const email=clean(document.getElementById("authEmail")?.value), password=document.getElementById("authPassword")?.value||"", msg=document.getElementById("authMsg");
 if(!email||password.length<6){if(msg)msg.innerHTML='<div class="auth-error">Use a valid email and a password of at least 6 characters.</div>';return}
 const {error}=await sb.auth.signUp({email,password});
 if(error){if(msg)msg.innerHTML=`<div class="auth-error">${esc(error.message)}</div>`}
 else if(msg)msg.innerHTML='<span class="badge good">Account created. Check email if confirmation is enabled.</span>';
}
async function signOut(){if(sb)await sb.auth.signOut()}
async function sharedLoad(){
 if(!sb||!currentUser)return null;
 const {data,error}=await sb.from("crm_state").select("state,updated_at").eq("user_id",currentUser.id).maybeSingle();
 if(error)throw error;
 return data?.state||null;
}
async function sharedSave(v){
 if(!sb||!currentUser)return false;
 const {error}=await sb.from("crm_state").upsert({user_id:currentUser.id,state:v,updated_at:new Date().toISOString()},{onConflict:"user_id"});
 if(error)throw error; return true;
}
async function init(){
 try{sample=await fetch("sample-data.json").then(r=>r.json())}catch(e){sample={mcaSample:[],gstSample:[],targetPins:defaultPins}}
 if(sharedConfigured()){
   const {data:{session},error}=await sb.auth.getSession();
   if(error){showAuth();return}
   currentUser=session?.user||null; authReady=true;
   sb.auth.onAuthStateChange((_event,session)=>{
     currentUser=session?.user||null;
     syncLabel();
     if(currentUser) loadAndStart().catch(e=>alert("Could not load shared CRM: "+e.message));
     else {state=null;showAuth()}
   });
   syncLabel();
   if(!currentUser){showAuth();return}
 }
 await loadAndStart();
}
 try{sample=await fetch("sample-data.json").then(r=>r.json())}catch(e){sample={mcaSample:[],gstSample:[],targetPins:defaultPins}}
 if(sharedConfigured()){
   const {data:{session}}=await sb.auth.getSession(); currentUser=session?.user||null; authReady=true;
   sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;syncLabel(); if(currentUser) loadAndStart().catch(e=>alert("Could not load shared CRM: "+e.message)); else {state=null;showAuth()}});
   syncLabel();
   if(!currentUser){showAuth();return}
 }
 await loadAndStart();
}
async function loadAndStart(){
 state=sharedConfigured()?await sharedLoad():await idbGet();
 if(!state){
   state={mca:sample.mcaSample||[],gst:sample.gstSample||[],companies:[],leads:{},calls:[],imports:[],pins:sample.targetPins||defaultPins,notes:{},schemaVersion:5};
   if((state.mca.length||state.gst.length)) state.imports.push({file:"Bundled CRM data — previous + fresh uploads",type:"MCA + GST",rows:state.mca.length+state.gst.length,date:new Date().toISOString(),sheets:"All supported sheets"});
   rebuild(false); await save();
 }else{
   state.mca ||= []; state.gst ||= []; state.companies ||= []; state.leads ||= {}; state.calls ||= []; state.imports ||= []; state.notes ||= {}; state.pins ||= defaultPins; state.schemaVersion=5;
   mergeUnique(state.mca,sample.mcaSample||[],"MCA"); mergeUnique(state.gst,sample.gstSample||[],"GST");
   rebuild(false); await save();
 }
 bindNav();
 const fileInput=document.getElementById("fileInput"); if(fileInput)fileInput.onchange=e=>bulkReadFiles([...e.target.files]);
 addSyncControls();
 renderFromHash();
}
function addSyncControls(){
 const top=document.querySelector(".top .actions"); if(!top)return;
 if(document.getElementById("syncStatus"))return;
 const pill=document.createElement("span"); pill.id="syncStatus"; pill.className="sync-pill"; top.prepend(pill);
 if(sharedConfigured()&&currentUser){const b=document.createElement("button");b.className="btn";b.textContent="Sign out";b.onclick=signOut;top.appendChild(b)}
 syncLabel();
}
let saveQueue=Promise.resolve();
async function save(){
 if(!state)return;
 const snapshot=structuredClone?structuredClone(state):JSON.parse(JSON.stringify(state));
 saveQueue=saveQueue.then(async()=>{
   if(sharedConfigured()&&currentUser){
     try{await sharedSave(snapshot);syncLabel()}catch(e){console.error(e);try{await idbPut(snapshot)}catch(_){}}
   }else{
     try{await idbPut(snapshot)}catch(e){console.error(e)}
   }
 }).catch(console.error);
 return saveQueue;
}
function clean(s){if(s===null||s===undefined)return ""; if(s instanceof Date&&!isNaN(s))return s.toISOString().slice(0,10); return String(s).replace(/^[`']+/,"").replace(/\\s+/g," ").trim()}
function digits(s){return clean(s).replace(/\\D/g,"")}
function phone(s){let d=digits(s); if(d.length===10)return "+91"+d; if(d.length===12&&d.startsWith("91"))return "+"+d; if(d.length===11&&d.startsWith("0"))return "+91"+d.slice(1); return clean(s)}
function pinFrom(s){let m=clean(s).match(/(?:^|\\D)([1-9][0-9]{5})(?:$|\\D)/);return m?m[1]:""}
function extractPinFromRow(r){
 const entries=Object.entries(r||{});
 const priority=entries.filter(([k])=>/(pin|pincode|postal|postcode|zip|address|location|locality|city|district|area)/i.test(k));
 for(const [k,v] of priority){const p=pinFrom(v);if(p)return p}
 for(const v of Object.values(r||{})){const p=pinFrom(v);if(p)return p}
 return "";
}
function addressFromRow(r){const vals=Object.entries(r||{}).filter(([k,v])=>clean(v)&&/(address|registeredoffice|principalplace|location|locality|street|road|village|town|building|premise)/i.test(norm(k))).map(([,v])=>clean(v));return vals.sort((a,b)=>((pinFrom(b)?1:0)*100+b.length)-((pinFrom(a)?1:0)*100+a.length))[0]||"";}
function sourceFields(r){const o={};for(const [k,v] of Object.entries(r||{})){const x=clean(v);if(x)o[k]=x}return o}
function firstByValue(r,pred){for(const v of Object.values(r||{})){const x=clean(v);if(x&&pred(x))return x}return ""}
function isLikelyName(v){const x=clean(v);return x.length>=2&&!isDateLike(x)&&!isPhoneLike(x)&&!isEmailLike(x)&&!/^[0-9.]+$/.test(x)}
function norm(s){return clean(s).toLowerCase().replace(/[^a-z0-9]/g,"")}
function money(n){let x=Number(String(n??"").replace(/,/g,""));return Number.isFinite(x)?new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(x):"N/A"}
function val(o,keys){
 const items=Object.keys(o||{}).map(k=>({nk:norm(k),k,v:clean(o[k])})).filter(x=>x.v);
 const aliases=keys.map(norm).sort((a,b)=>b.length-a.length);
 for(const a of aliases){const x=items.find(z=>z.nk===a);if(x)return x.v}
 for(const a of aliases){if(a.length<4)continue;const cand=items.filter(z=>z.nk.includes(a)||a.includes(z.nk)).sort((x,y)=>((y.nk===a?100:y.nk.startsWith(a)||y.nk.endsWith(a)?70:50)-y.nk.length/100)-((x.nk===a?100:x.nk.startsWith(a)||x.nk.endsWith(a)?70:50)-x.nk.length/100));if(cand[0])return cand[0].v}
 return "";
}
function num(v){let x=Number(String(v??"").replace(/[^0-9.-]/g,""));return Number.isFinite(x)?x:""}
function hashKey(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ("00000000"+(h>>>0).toString(16)).slice(-8)}
function identityRow(r,type){
 if(type==="MCA") return "MCA|"+(norm(r.entityId)||norm(r.name)+"|"+norm(r.directorName)+"|"+norm(r.directorMobile));
 return "GST|"+(norm(r.gst_number)||norm(r.pan)||norm(r.legal_name||r.name)+"|"+norm(r.mobile));
}
function mergeUnique(target,rows,type){
 const seen=new Set(target.map(r=>identityRow(r,type)));
 for(const r of rows){const k=identityRow(r,type);if(k&&!seen.has(k)){target.push(r);seen.add(k)}}
}
function isDateLike(v){return /^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(clean(v)) || /^\d{1,2}[-/]\d{1,2}[-/]\d{4}/.test(clean(v))}
function isPhoneLike(v){let d=digits(v);return d.length>=10&&d.length<=13}
function isEmailLike(v){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(clean(v))}
function isShiftedMca(r){
 return clean(r.state).toUpperCase().startsWith("ROC ") &&
        ["Private","Public","One Person Company"].includes(clean(r.district)) &&
        isDateLike(r.roc) &&
        (isEmailLike(r.nicLabel)||isPhoneLike(r.classOfCompany)) &&

  return (!q||blob.includes(q))&&(!pin||c.pincode===pin)&&(!ls||l.status===ls)&&(!gs||c.gstStatus.toLowerCase().includes(gs))&&(!min||cap>=min)&&(!max||cap<=max)&&(!ind||String(c.nicCode).toLowerCase().includes(ind)||String(c.nicLabel).toLowerCase().includes(ind)||c.nature.toLowerCase().includes(ind))&&(!call||l.callStatus===call)&&(!qual||(qual==="minimum"&&c.quality.minimum)||(qual==="contactable"&&c.quality.contactable)||(qual==="incomplete"&&!c.quality.minimum));
 });
}
function companies(c,onlyTarget=false,status="",params=new URLSearchParams()){
 c.innerHTML=(onlyTarget?`<div class="panel"><h2>My Target Customers</h2><p class="muted">Only records meeting the minimum data requirement and matching your selected Delhi/Haryana/Gurugram PINs.</p></div>`:"")+filtersHtml()+`<div class="panel"><div class="toolbar"><b id="count">0 records</b><div class="actions"><button class="btn" onclick="exportCurrent()">Export CSV/XLSX</button></div></div><div id="table"></div></div>`;
 if(status){document.getElementById("fLead").value=status}
 window._base=onlyTarget?state.companies.filter(isTarget):state.companies;
 const f=params.get("filter")||""; const filterEl=document.getElementById("fQuality");
 if(f==="minimum"&&filterEl)filterEl.value="minimum"; else if(f==="contactable"&&filterEl)filterEl.value="contactable"; else if(f==="incomplete"&&filterEl)filterEl.value="incomplete";
 if(f==="mca")window._base=window._base.filter(x=>(x.mcaRowCount||0)>0);
 if(f==="gst")window._base=window._base.filter(x=>(x.gstRowCount||0)>0);
 if(f.startsWith("pin:")){const pin=f.slice(4);const pe=document.getElementById("fPin");if(pe)pe.value=pin}
 applyFilters();
}
function applyFilters(){
 let data=getFiltered(window._base||state.companies); document.getElementById("count").textContent=data.length+" records"; document.getElementById("table").innerHTML=tableHtml(data);
}
function clearFilters(){["fSearch","fGst","fMin","fMax","fIndustry"].forEach(x=>{let e=document.getElementById(x);if(e)e.value=""});["fPin","fLead","fCall","fQuality"].forEach(x=>{let e=document.getElementById(x);if(e)e.value=""});applyFilters()}
function tableHtml(data){
 if(!data.length)return `<div class="empty">No matching records.</div>`;
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Customer / Director</th><th>Company</th><th>Mobile</th><th>GST</th><th>PAN</th><th>PIN</th><th>Paid-up</th><th>Business</th><th>MCA/GST Rows</th><th>Quality</th><th>Call</th><th>Lead</th><th>Action</th></tr></thead><tbody>${data.map(c=>{
  const l=state.leads[c.id]||{callStatus:"Call Not Done",status:"New"}; const d=c.directors[0]; const contact=d?.name||c.legalName||c.tradeName||"—"; const mob=phone(d?.mobile)||c.mobile;
  return `<tr><td>${esc(contact)}${c.directors.length>1?` <span class="badge">${c.directors.length} directors</span>`:""}</td><td>${esc(c.companyName)}</td><td>${mob?`<a href="tel:${escAttr(mob)}" class="btn good" onclick="callNow('${c.id}','${escAttr(mob)}')">📞 ${esc(mob)}</a>`:"N/A"}</td><td>${esc(c.gst||"N/A")}</td><td>${esc(c.pan||"N/A")}</td><td>${esc(c.pincode||"N/A")}</td><td>${money(c.paidUp)}</td><td>${esc(c.nature||c.nicLabel||"N/A")}</td><td>${c.mcaRowCount||0}/${c.gstRowCount||0}</td><td>${c.quality.minimum?`<span class="badge good">Minimum met</span>`:`<span class="badge bad">Missing</span>`}</td><td><select onchange="setCall('${c.id}',this.value)">${["Call Not Done","Call Done"].map(x=>`<option ${l.callStatus===x?"selected":""}>${x}</option>`).join("")}</select></td><td><select onchange="setLead('${c.id}',this.value)">${["New","Potential","Interested","Follow-up","Converted","Not Interested","Wrong Number","No Response","Do Not Call"].map(x=>`<option ${l.status===x?"selected":""}>${x}</option>`).join("")}</select></td><td><button class="btn" onclick="openCompany('${c.id}')">View</button></td></tr>`;
 }).join("")}</tbody></table></div>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function ensureLead(id){state.leads[id] ||= {status:"New",callStatus:"Call Not Done",attempts:0,notes:"",nextFollowup:"",updatedAt:""};return state.leads[id]}
function setLead(id,v){let l=ensureLead(id);l.status=v;l.updatedAt=new Date().toISOString();save();if(location.hash.includes("interested")||location.hash.includes("potential"))render(location.hash.slice(1))}
function setCall(id,v){let l=ensureLead(id);l.callStatus=v;l.updatedAt=new Date().toISOString();save()}
function callNow(id,mob){if(!mob)return;let l=ensureLead(id);l.attempts=(l.attempts||0)+1;l.callStatus="Call Done";l.updatedAt=new Date().toISOString();state.calls.unshift({id:"CL"+Date.now(),companyId:id,date:new Date().toISOString(),result:"Call initiated",notes:"Dialer opened"});save()}
function openCompany(id){
 const c=state.companies.find(x=>x.id===id),l=ensureLead(id);if(!c)return;
 document.getElementById("overlay").classList.remove("hidden");const d=document.getElementById("drawer");d.classList.remove("hidden");
 d.innerHTML=`<div class="toolbar"><h2 style="margin:0">${esc(c.companyName)}</h2><button class="btn" onclick="closeDrawer()">✕</button></div>
 <div class="panel"><h2>Data quality</h2><p>Source rows: MCA <b>${c.mcaRowCount||0}</b> · GST <b>${c.gstRowCount||0}</b>. ${c.quality.minimum?'<span class="badge good">Minimum requirement met</span>':'<span class="badge bad">Incomplete</span>'} ${c.quality.contactable?'<span class="badge good">Contactable</span>':''}</p>${c.quality.missing.length?`<div class="muted">Missing: ${esc(c.quality.missing.join(", "))}</div>`:""}</div>
 <div class="panel"><h2>Contact & calling</h2>${c.directors.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.name||"Director")}</b><div class="muted">${esc(x.email||"")}</div>${x.mobile?`<a class="btn good" href="tel:${escAttr(x.mobile)}" onclick="callNow('${c.id}','${escAttr(x.mobile)}')">📞 ${esc(x.mobile)}</a>`:"N/A"}</div>`).join("")}<div style="margin-top:10px">${c.mobile?`<a class="btn good" href="tel:${escAttr(c.mobile)}" onclick="callNow('${c.id}','${escAttr(c.mobile)}')">📞 Primary Mobile ${esc(c.mobile)}</a>`:""} ${c.email?`<a class="btn" href="mailto:${escAttr(c.email)}">✉ ${esc(c.email)}</a>`:""}</div></div>
 <div class="panel"><h2>Lead</h2><div class="grid"><div class="field"><label>Status</label><select id="drawerLead" onchange="setLead('${id}',this.value)">${["New","Potential","Interested","Follow-up","Converted","Not Interested","Wrong Number","No Response","Do Not Call"].map(x=>`<option ${l.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Call Status</label><select onchange="setCall('${id}',this.value)"><option ${l.callStatus==="Call Not Done"?"selected":""}>Call Not Done</option><option ${l.callStatus==="Call Done"?"selected":""}>Call Done</option></select></div><div class="field"><label>Next Follow-up</label><input type="date" id="follow" value="${l.nextFollowup||""}"></div><div class="field"><label>Attempts</label><input value="${l.attempts||0}" disabled></div></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="notes">${esc(l.notes||"")}</textarea></div><button class="btn primary" style="margin-top:10px" onclick="saveLead('${id}')">Save Lead</button></div>
 <div class="panel"><h2>Company / GST / MCA</h2><p><b>GSTIN:</b> ${esc(c.gst||"N/A")}<br><b>PAN:</b> ${esc(c.pan||"N/A")}<br><b>CIN / Entity ID:</b> ${esc(c.entityId||"N/A")}<br><b>Paid-up:</b> ${money(c.paidUp)}<br><b>Authorized:</b> ${money(c.authorized)}<br><b>GST status:</b> ${esc(c.gstStatus||"N/A")}<br><b>GST date:</b> ${esc(c.gstDate||"N/A")}<br><b>Incorporation:</b> ${esc(c.incorporation||"N/A")}<br><b>ROC:</b> ${esc(c.roc||"N/A")}<br><b>Business:</b> ${esc(c.nature||c.nicLabel||"N/A")}<br><b>Company type:</b> ${esc(c.classOfCompany||"N/A")}</p></div>
 <div class="panel"><h2>Address</h2><p>${esc(c.address||"N/A")}<br><b>City:</b> ${esc(c.city||"N/A")} &nbsp; <b>District:</b> ${esc(c.district||"N/A")} &nbsp; <b>State:</b> ${esc(c.state||"N/A")} &nbsp; <b>PIN:</b> ${esc(c.pincode||"N/A")}</p></div><div class="panel"><h2>Original source data</h2><p class="muted">Retained source rows — MCA: ${c.mcaRowCount||0}, GST: ${c.gstRowCount||0}. All original fields are preserved.</p><details><summary>Show all imported fields</summary><pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:10px;border-radius:8px">${esc(JSON.stringify(c.sourceFields||{},null,2))}</pre></details></div>
 <div class="panel"><h2>Call History</h2>${state.calls.filter(x=>x.companyId===id).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${new Date(x.date).toLocaleString()} — ${esc(x.result)}<div class="muted">${esc(x.notes||"")}</div></div>`).join("")||'<span class="muted">No calls recorded.</span>'}</div>`;
}
function saveLead(id){let l=ensureLead(id);l.nextFollowup=document.getElementById("follow").value;l.notes=document.getElementById("notes").value;l.updatedAt=new Date().toISOString();save();closeDrawer();render(location.hash.slice(1)||"dashboard")}
function closeDrawer(){document.getElementById("overlay").classList.add("hidden");document.getElementById("drawer").classList.add("hidden")}
function followups(c){
 const today=new Date().toISOString().slice(0,10),rows=state.companies.filter(x=>state.leads[x.id]?.nextFollowup).sort((a,b)=>state.leads[a.id].nextFollowup.localeCompare(state.leads[b.id].nextFollowup));
 c.innerHTML=`<div class="panel"><h2>Follow-ups</h2><p class="muted">Today: ${today}. Overdue items appear first.</p><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Company</th><th>Mobile</th><th>Status</th><th>Notes</th><th>Action</th></tr></thead><tbody>${rows.map(x=>{let l=state.leads[x.id];return `<tr><td><span class="badge ${l.nextFollowup<today?"bad":l.nextFollowup===today?"warn":"good"}">${l.nextFollowup}</span></td><td>${esc(x.companyName)}</td><td>${x.mobile?`<a href="tel:${escAttr(x.mobile)}" class="btn good" onclick="callNow('${x.id}','${escAttr(x.mobile)}')">📞 Call</a>`:"N/A"}</td><td>${esc(l.status)}</td><td>${esc(l.notes||"")}</td><td><button class="btn" onclick="openCompany('${x.id}')">Open</button></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">No follow-ups scheduled.</td></tr>`}</tbody></table></div></div>`;
}
function calls(c){
 c.innerHTML=`<div class="panel"><h2>Call History</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Company</th><th>Result</th><th>Notes</th></tr></thead><tbody>${state.calls.map(x=>{let co=state.companies.find(c=>c.id===x.companyId);return `<tr><td>${new Date(x.date).toLocaleString()}</td><td>${esc(co?.companyName||"Unknown")}</td><td>${esc(x.result)}</td><td>${esc(x.notes||"")}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">No calls yet.</td></tr>`}</tbody></table></div></div>`;
}
function upload(c){
 c.innerHTML=`<div class="panel"><h2>Daily Data Upload</h2><p class="muted">Upload one or many files. The CRM reads <b>all non-empty rows across all non-empty sheets</b>, automatically detects MCA vs GST, handles flexible/dirty column names, repairs shifted MCA exports, extracts PIN codes from complete address cells, and retains every source row and source field. Large datasets are stored in browser IndexedDB instead of a small localStorage limit. You do not need to choose the data type.</p>
 <div class="drop" id="drop">Drop multiple XLSX/XLS/XLSB/ODS/CSV files here or choose files<input type="file" id="up" accept=".xlsx,.xls,.xlsb,.ods,.csv" multiple></div><div id="importMsg" style="margin-top:12px"></div></div>
 <div class="panel"><h2>Minimum requirement</h2><p class="muted">A record is considered usable when it has a company/name plus at least one of GSTIN, PAN, CIN/entity ID, mobile, or email. Incomplete records are retained and marked instead of being silently discarded.</p></div>
 <div class="panel"><h2>Import history</h2>${state.imports.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(x.file)}</b> — ${esc(x.type)} — ${x.rows} rows${x.sheets?` — ${esc(x.sheets)}`:""} — ${new Date(x.date).toLocaleString()}${x.skipped?` — skipped ${x.skipped}`:""}</div>`).join("")||'<span class="muted">No imports yet.</span>'}</div>`;
 document.getElementById("up").onchange=e=>bulkReadFiles([...e.target.files]);
 document.getElementById("drop").ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect="copy"};
 document.getElementById("drop").ondrop=e=>{e.preventDefault();bulkReadFiles([...e.dataTransfer.files])};
}
async function bulkReadFiles(files){
 if(!files.length)return;
 const msg=document.getElementById("importMsg"); if(msg)msg.innerHTML=`<span class="badge warn">Reading ${files.length} file(s)…</span>`;
 let totalM=0,totalG=0, skipped=0, details=[];
 for(const file of files){
   try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    let fm=0,fg=0,fs=0;
    for(const sheetName of wb.SheetNames){
      const rows=parseSheetRows(wb.Sheets[sheetName],sheetName,file.name);
      if(!rows.length)continue;
      const type=detectType(rows,sheetName,file.name);
      if(!type){skipped+=rows.length;continue}
      if(type==="MCA"){const cleanRows=rows.map(normalizeMca);mergeUnique(state.mca,cleanRows,"MCA");fm+=cleanRows.length;totalM+=cleanRows.length}
      else{const cleanRows=rows.map(normalizeGst);mergeUnique(state.gst,cleanRows,"GST");fg+=cleanRows.length;totalG+=cleanRows.length}
      fs++;
    }
    details.push(`${file.name}: ${fm} MCA + ${fg} GST rows from ${fs} sheet(s)`);
    state.imports.unshift({file:file.name,type:fm&&fg?"MCA + GST":fm?"MCA":"GST",rows:fm+fg,date:new Date().toISOString(),sheets:fs+" non-empty sheet(s)"});
   }catch(err){
    skipped++; details.push(`${file.name}: ERROR — ${err.message}`);
   }
 }
 rebuild();
 if(msg)msg.innerHTML=`<span class="badge good">Imported ${totalM} MCA + ${totalG} GST rows.</span>${skipped?` <span class="badge bad">Unclassified ${skipped} rows/sheets.</span>`:""}<div class="muted" style="margin-top:8px">${details.map(esc).join("<br>")}</div>`;
 render("upload");
}
function exportRows(rows,filename){
 const out=rows.map(c=>{let l=state.leads[c.id]||{},d=c.directors[0]||{};return {
 "Customer Name":d.name||c.legalName||c.tradeName||c.companyName||"", "Company Name":c.companyName,"Legal Name":c.legalName,"Trade Name":c.tradeName,
 "CIN / Entity ID":c.entityId,"GST Number":c.gst,"PAN":c.pan,"Mobile Number":c.mobile||d.mobile,"Email":c.email,
 "Director Name":d.name,"Director Mobile":d.mobile,"Director Email":d.email,"Full Address":c.address,"City":c.city,"District":c.district,"State":c.state,"PIN Code":c.pincode,
 "Nature of Business":c.nature,"NIC Code":c.nicCode,"NIC Label":c.nicLabel,"Company Type":c.classOfCompany,"MCA Status":c.companyStatus,"ROC":c.roc,"GST Status":c.gstStatus,
 "Date of Incorporation":c.incorporation,"GST Registration Date":c.gstDate,"Paid-up Capital":c.paidUp,"Authorized Capital":c.authorized,
 "Minimum Data Met":c.quality.minimum?"Yes":"No","Contactable":c.quality.contactable?"Yes":"No","Call Status":l.callStatus||"Call Not Done","Lead Status":l.status||"New",
 "Last Updated":l.updatedAt||"","Call Attempts":l.attempts||0,"Next Follow-up":l.nextFollowup||"","Notes":l.notes||""
 }});
 const ws=XLSX.utils.json_to_sheet(out),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Leads");XLSX.writeFile(wb,filename);
}
function exportCurrent(){exportRows(getFiltered(window._base||state.companies),"filtered-leads.xlsx")}
function exportsPage(c){
 c.innerHTML=`<div class="panel"><h2>Exports</h2><p class="muted">Exports include source fields plus CRM fields and data-quality flags.</p><div class="actions"><button class="btn primary" onclick="exportRows(state.companies.filter(isTarget),'my-target-customers.xlsx')">Export My Target Customers</button><button class="btn" onclick="exportRows(state.companies.filter(x=>state.leads[x.id]?.status==='Interested'),'interested-leads.xlsx')">Export Interested</button><button class="btn" onclick="exportRows(state.companies.filter(x=>state.leads[x.id]?.status==='Potential'),'potential-leads.xlsx')">Export Potential</button><button class="btn" onclick="exportRows(state.companies.filter(x=>(state.leads[x.id]?.callStatus||'Call Not Done')==='Call Not Done'),'call-not-done.xlsx')">Export Call Not Done</button><button class="btn" onclick="exportRows(state.companies,'all-companies.xlsx')">Export All Companies</button></div></div>`;
}
function settings(c){
 c.innerHTML=`<div class="panel"><h2>Target PIN Codes</h2><p class="muted">Click a PIN to enable/disable it. Add another below.</p><div class="pinbox">${defaultPins.map(p=>`<button class="pin ${state.pins.includes(p)?"on":""}" onclick="togglePin('${p}')">${p}</button>`).join("")}</div><div class="actions" style="margin-top:14px"><input id="newPin" placeholder="6-digit PIN" maxlength="6"><button class="btn primary" onclick="addPin()">Add PIN</button><button class="btn" onclick="resetPins()">Reset Defaults</button></div></div>
 <div class="panel"><h2>Data storage</h2><p class="muted">${sharedConfigured()&&currentUser?"Shared sync is active. Companies, leads, calls and uploads are saved to your Supabase account and can be used from other devices after sign-in.":"This browser is using IndexedDB locally. Configure Supabase in index.html to share the same CRM database across devices."}</p><div class="actions"><button class="btn danger" onclick="clearAllData()">Clear All CRM Data</button></div></div>`;
}
function togglePin(p){state.pins=state.pins.includes(p)?state.pins.filter(x=>x!==p):[...state.pins,p];save();render("settings")}
function addPin(){let p=digits(document.getElementById("newPin").value);if(/^[1-9]\d{5}$/.test(p)){if(!state.pins.includes(p))state.pins.push(p);save();render("settings")}}
function resetPins(){state.pins=[...defaultPins];save();render("settings")}
async function clearAllData(){
 if(!confirm("Delete all imported and CRM data? This will remove the shared cloud record for this signed-in account when shared sync is enabled."))return;
 try{
   if(sharedConfigured()&&currentUser){const {error}=await sb.from("crm_state").delete().eq("user_id",currentUser.id);if(error)throw error}
   const db=await idbOpen();await new Promise((resolve,reject)=>{const r=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).delete(DB_KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)});db.close();location.reload();
 }catch(e){alert("Could not clear CRM data: "+e.message)}
}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mca-gst-crm-backup.json";a.click();URL.revokeObjectURL(a.href)}
init();
</script>
