<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCA + GST Lead CRM</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{margin:0;font:14px system-ui;background:#f5f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:225px;background:#111827;color:white;padding:14px}.main{flex:1}.top{height:58px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;gap:8px}.top h1{flex:1;font-size:18px}.content{padding:14px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.card{cursor:pointer}.n{font-size:22px;font-weight:800}.muted{color:#667085;font-size:12px}nav button{display:block;width:100%;padding:10px;border:0;background:none;color:#d1d5db;text-align:left;border-radius:8px;cursor:pointer}nav button.active,nav button:hover{background:#1f2937;color:white}.btn{padding:8px 11px;border:1px solid #d0d5dd;background:white;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:white;border-color:#2563eb}.actions{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto;margin-top:8px}.table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px}.good{background:#ecfdf3;color:#166534}.warn{background:#fffbeb;color:#92400e}.menu{display:none}@media(max-width:700px){.side{display:none;position:fixed;inset:0 auto 0 0;width:280px;z-index:10}.side.open{display:block}.menu{display:block;width:42px;height:42px;border:1px solid #ddd;background:white;border-radius:9px;font-size:22px}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:10px}.top{height:auto;min-height:58px}.top .backup{display:none}}</style></head><body><div class="app"><aside id="side" class="side"><b>MCA + GST CRM</b><div class="muted" style="margin:4px 0 12px">Target → Call → Lead → Follow-up</div><nav id="nav"></nav></aside><main class="main"><header class="top"><button class="menu" onclick="side.classList.toggle('open')">☰</button><h1 id="title">Dashboard</h1><div class="actions"><span id="sync" class="badge">Local</span><button class="btn backup" onclick="backup()">Backup</button><button class="btn primary" onclick="file.click()">Upload</button></div></header><div id="content" class="content"></div></main></div><input id="file" hidden type="file" multiple accept=".xlsx,.xls,.csv,.ods"><script>const DB_KEY='mca_gst_crm_state_v6';let state=JSON.parse(localStorage.getItem(DB_KEY)||'null')||{companies:[],leads:{},imports:[],pins:['110001','400001','560001','500001','600001']};const pages={dashboard:'Dashboard',companies:'All Companies',interested:'Interested Leads',potential:'Potential Leads',upload:'Data Upload',exports:'Exports',settings:'Settings'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const key=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');function first(o,n){for(const a of n){const k=key(a),h=Object.keys(o).find(x=>key(x)===k||key(x).includes(k));if(h&&String(o[h]).trim())return String(o[h]).trim()}return''}function pin(v){const m=String(v||'').match(/\b[1-9]\d{5}\b/g);return m?m[m.length-1]:''}function norm(r){let company=first(r,['company name','company','legal name','trade name','business name','name','entity name']);let address=first(r,['full address','registered office address','address','location']);let gst=first(r,['gstin','gst number','gst no','gst']);let pan=first(r,['pan','pan number']);let cin=first(r,['cin','cin number','entity id','registration number']);let mobile=String(first(r,['mobile','mobile number','phone','contact number'])).replace(/\D/g,'').slice(-10);let email=first(r,['email','email id','email address']);let p=pin(first(r,['pin','pincode','pin code','postal code','zip','address','full address','location']));let id=(cin||gst||pan||mobile||email||company).toLowerCase().replace(/\s+/g,'_');return{id,companyName:company||'Unnamed record',gst,pan,entityId:cin,mobile,email,address,pincode:p,quality:{minimum:!!company&&(!!gst||!!pan||!!cin||!!mobile||!!email),contactable:!!(mobile||email)},raw:r}}function save(){localStorage.setItem(DB_KEY,JSON.stringify(state));sync.textContent='Saved'}function navRender(){nav.innerHTML=Object.entries(pages).map(([k,v])=>`<button data-p="${k}">${v}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{render(b.dataset.p);side.classList.remove('open')})}function render(p){title.textContent=pages[p];nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({dashboard,companies,interested,potential,upload,exports,settings}[p])(content)}function dashboard(c){c.innerHTML=`<div class="cards"><div class="card" onclick="render('companies')"><div class="n">${state.companies.length}</div><div class="muted">All Companies</div></div><div class="card" onclick="render('interested')"><div class="n">${state.companies.filter(x=>state.leads[x.id]?.status==='Interested').length}</div><div class="muted">Interested</div></div><div class="card" onclick="render('potential')"><div class="n">${state.companies.filter(x=>state.leads[x.id]?.status==='Potential').length}</div><div class="muted">Potential</div></div><div class="card"><div class="n">${state.companies.filter(x=>x.quality.minimum).length}</div><div class="muted">Minimum Data Met</div></div><div class="card"><div class="n">${state.companies.filter(x=>x.quality.contactable).length}</div><div class="muted">Contactable</div></div></div><div class="panel"><h3>Target PINs</h3>${state.pins.map(p=>`<button class="btn" style="margin:3px" onclick="pinFilter('${p}')">${p} (${state.companies.filter(x=>x.pincode===p).length})</button>`).join('')}</div>`}function table(c,list){c.innerHTML=`<div class="panel"><div class="actions"><input id="q" placeholder="Search company, GSTIN, PAN, CIN, mobile, email, PIN" style="flex:1;padding:9px;border:1px solid #d0d5dd;border-radius:8px"></div><div class="table-wrap"><table class="table"><thead><tr><th>Company</th><th>GSTIN</th><th>PAN</th><th>CIN / Entity ID</th><th>Mobile</th><th>Email</th><th>PIN</th><th>Status</th><th>Minimum Data</th></tr></thead><tbody id="tb">${makeRows(list)}</tbody></table></div></div>`;q.oninput=()=>{let s=key(q.value);tb.innerHTML=makeRows(state.companies.filter(x=>key(JSON.stringify(x)).includes(s)))}}function makeRows(list){return list.map(x=>`<tr><td>${esc(x.companyName)}</td><td>${esc(x.gst)}</td><td>${esc(x.pan)}</td><td>${esc(x.entityId)}</td><td>${esc(x.mobile)}</td><td>${esc(x.email)}</td><td>${esc(x.pincode)}</td><td>${esc(state.leads[x.id]?.status||'New')}</td><td>${x.quality.minimum?'<span class="badge good">Yes</span>':'<span class="badge warn">Incomplete</span>'}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">No records</td></tr>'}function companies(c,list=state.companies){table(c,list)}function pinFilter(p){title.textContent='Companies — PIN '+p;table(content,state.companies.filter(x=>x.pincode===p))}function interested(c){table(c,state.companies.filter(x=>state.leads[x.id]?.status==='Interested'))}function potential(c){table(c,state.companies.filter(x=>state.leads[x.id]?.status==='Potential'))}function upload(c){c.innerHTML='<div class="panel"><h2>Data Upload</h2><p class="muted">Upload multiple MCA/GST files. All non-empty sheets are read. Rows are retained even when incomplete, and PIN codes are extracted from address/location cells.</p><div class="actions"><button class="btn primary" onclick="file.click()">Choose files</button></div><div style="margin-top:10px">'+state.imports.map(x=>`<div>${esc(x.file)} — ${x.rows} rows</div>`).join('')+'</div></div>'}file.onchange=e=>readFiles(e.target.files);async function readFiles(files){let added=0;for(const f of files){try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),n=0;for(const sn of wb.SheetNames){for(const r of XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''})){let x=norm(r),old=state.companies.find(y=>y.id===x.id);if(old)Object.assign(old,x);else{state.companies.push(x);added++}n++}}state.imports.unshift({file:f.name,rows:n,date:new Date().toISOString()})}catch(e){alert(f.name+': '+e.message)}}save();render('companies');alert('Imported '+added+' new records')}function exports(c){c.innerHTML='<div class="panel"><h2>Exports</h2><button class="btn primary" onclick="download()">Export All Companies</button></div>'}function download(){let rows=state.companies.map(x=>({Company:x.companyName,GSTIN:x.gst,PAN:x.pan,CIN:x.entityId,Mobile:x.mobile,Email:x.email,PIN:x.pincode,Status:state.leads[x.id]?.status||'New'}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,'mca-gst-leads.xlsx')}function settings(c){c.innerHTML=`<div class="panel"><h2>Target PIN Codes</h2><input id="pinInput" value="${esc(state.pins.join(','))}" style="width:100%;padding:9px"><button class="btn primary" style="margin-top:8px" onclick="state.pins=pinInput.value.split(',').map(x=>x.trim()).filter(x=>/^\\d{6}$/.test(x));save();render('settings')">Save PINs</button></div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mca-gst-crm-backup.json';a.click()}navRender();render('dashboard');</script></body></html>
